<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset = "UTF-8">
    <link href="options.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
      <div id="left">
        <div class="section">
          <div class="asana-title"> Asana Settings </div>
          <div class="asana-box">
            <div>
              <label for="access-token" class="settingsLabel">Personal Access Token (*)</label>
              <input type="text" id="access-token" name="access-token" class="settingsInput">
            </div>
            <div>
              <label for="workspace-id" class="settingsLabel">Asana Workspace ID (*)</label>
              <input type="text" id="workspace-id" name="workspace-id" class="settingsInput">
            </div>
            <div>
              <label for="team-id" class="settingsLabel">Asana Team ID (*)</label>
              <input type="text" id="team-id" name="team-id" class="settingsInput">
            </div>
          </div>
          <div class="saveButtonArea">
            <button type="button" id="saveAsanaSettingsButton" class="asana-save-button asana-button">Save Asana Settings</button>
          </div>
        </div>

        <div class="section">
          <div class="asana-title"> Custom Fields (Enum) </div>
          <div class="asana-box" style="margin-bottom: 10px;"> <div>
              <label for="project-gid-for-custom-fields" class="settingsLabel">Project GID for Custom Fields Setup</label>
              <input type="text" id="project-gid-for-custom-fields" name="project-gid-for-custom-fields" class="settingsInput">
            </div>
            <div class="saveButtonArea" style="margin-top: 10px;">
              <button type="button" id="loadCustomFieldsForProjectButton" class="asana-button">Load Custom Fields for this GID</button>
            </div>
          </div>
          <div id="custom-fields-target-project-info" style="margin-left:10px; font-weight:bold; margin-bottom: 5px;"></div>
          <div class="scrollBox" id="custom-fields-container">
            <div id="custom-fields-loading">
            </div>
            <div id="custom-fields">
            </div>
          </div>
          <div class="saveButtonArea">
            <button type="button" id="saveCustomFieldsButton" class="asana-save-button asana-button">Save Custom Fields Selections</button>
          </div>
        </div>
      </div>

      <div id="right">
        <div class="section">
          <div class="jira-title"> Jira Settings </div>
          <div class="jira-box">
            <div>
              <label for="jira-prefix" class="settingsLabel">Jira Issue Prefix (*)</label>
              <input type="text" id="jira-prefix" name="jira-prefix" class="settingsInput">
            </div>
            <div>
              <label for="jira-regexp" class="settingsLabel">Regexp for cutting text from Jira title</label>
              <input type="text" id="jira-regexp" name="jira-regexp" class="settingsInput">
            </div>
          </div>
          <div class="saveButtonArea">
            <button type="button" id="saveJiraSettingsButton" class="jira-save-button jira-button">Save Jira Settings</button>
          </div>
        </div>

        <div class="section">
          <div class="hint-title"> Hints </div>
          <div class="hint-box">
            <ol>
              <li>Saving Asana Settings might reset other configurations.</li>
              <li>Only 'Enum' type custom fields are supported for selection.</li>
              <li>If unresolvable problems occur, try reinstalling the extension.</li>
            </ol>
          </div>
        </div>
      </div>
      <script src="options.js"></script>
  </body>
</html>
